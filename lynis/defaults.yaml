# -*- coding: utf-8 -*-
# vim: ft=yaml
---
lynis:
  package: lynis
  bin: /usr/sbin/lynis
  install_plugins: false

  config_dir: /etc/lynis
  config:
    profiles: {}

  # Periodic audit: a systemd timer runs `lynis audit system --cronjob`.
  # The report stays on the host (/var/log/lynis-report.dat).
  audit:
    enabled: true
    on_calendar: weekly
    randomized_delay: 6h
